[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owasp-llm05-demo"
version = "1.0.0"
description = "Educational demonstration of OWASP LLM05 (Data & Model Poisoning) via RAG knowledge-base poisoning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Security Demo" }]
keywords = ["owasp", "llm05", "rag", "security", "poisoning", "ai-security"]
dependencies = []  # core demo runs on the standard library only

[project.optional-dependencies]
server = ["flask>=3.0", "requests>=2.31"]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0"]

[project.scripts]
llm05-demo = "llm05_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
