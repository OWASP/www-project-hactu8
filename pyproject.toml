[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hactu8"
version = "0.1.0"
description = "OWASP HACTU8: repeatable security assurance tests for AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4"]
lamb = ["mcp>=2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.31,<1"]

[project.scripts]
hactu8 = "hactu8.cli:main"
hactu8-lamb = "hactu8.lamb.__main__:main"
hactu8-api = "hactu8.api:main"

[tool.setuptools.packages.find]
include = ["hactu8*"]

[tool.setuptools.package-data]
hactu8 = ["schemas/*.json", "bench/*.json", "lamb/okf_bundle/*.md"]
