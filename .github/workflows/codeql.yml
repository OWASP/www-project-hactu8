# Code scanning: CodeQL over the Python core and the TypeScript console on every
# push and pull request to the phase1 branches, and weekly. Results go to the
# repository's Security tab (code scanning alerts); no repository settings change.
# demos/ is excluded: the labs are deliberately vulnerable. Lamb (hactu8/lamb) is a
# deliberate target too, so an alert there is triaged against SECURITY.md first.
name: CodeQL

on:
  push:
    branches: ["phase1-*"]
  pull_request:
    branches: ["phase1-*"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              # The labs are vulnerable on purpose (SECURITY.md) and hold vendored copies of hactu8/.
              - "demos/**"
              - "**/node_modules/**"
              - "**/dist/**"
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
